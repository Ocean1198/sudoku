name: Deploy Sudoku React

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sudoku-react/package-lock.json

      - name: Install dependencies
        working-directory: ./sudoku-react
        run: npm ci

      - name: Build
        working-directory: ./sudoku-react
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir -p ./pages/sudoku-react
          cp -r ./sudoku-react/dist/. ./pages/sudoku-react/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4